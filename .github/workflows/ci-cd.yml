name: CI-CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.salvini007 }}
          password: ${{ secrets.Salu@0730 }}

      - name: Build and Push Backend
        run: |
          docker build -t salvini007/django-backend ./backend
          docker push salvini007/django-backend

      - name: Build and Push Frontend
        run: |
          docker build -t salvini007/react-frontend ./frontend
          docker push salvini007/react-frontend
